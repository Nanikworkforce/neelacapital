# Kept for local reference. Prefer repo-root render.yaml (monorepo).
# Canonical service: neela-backend-96ia.onrender.com
# Root Directory: Neela-Tenant-App-2/backend
services:
  - type: web
    name: neela-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn neela_backend.wsgi:application

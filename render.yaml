# Canonical Render backend for the full Neela app (website + portal + admin + manager).
# Keep only ONE web service on Render: neela-backend-96ia
# Suspend/delete neela-backend-dfmg after this is confirmed live.
#
# Root Directory on Render MUST be: Neela-Tenant-App-2/backend
services:
  - type: web
    name: neela-backend
    runtime: python
    rootDir: Neela-Tenant-App-2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn neela_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SITE_URL
        value: https://neelacapital.com
      - key: FRONTEND_URL
        value: https://neelacapital.com/portal
      - key: LANDLORD_EMAIL
        value: info@neelacapital.com
      - key: ADMIN_EMAIL
        value: info@neelacapital.com
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: NEELAGUEST_URL
        value: https://neelacapital.com/portal/guest

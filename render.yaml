# Canonical Render backend for the full Neela app (website + portal + admin + manager).
# Root Directory on Render MUST be: Neela-Tenant-App-2/backend
services:
  - type: web
    name: neela-backend
    runtime: python
    rootDir: Neela-Tenant-App-2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn neela_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: USE_CELERY
        value: "false"
      - key: SITE_URL
        value: https://neelacapital.com
      - key: FRONTEND_URL
        value: https://neelacapital.com/portal
      - key: NEELAGUEST_URL
        value: https://neelacapital.com/portal/guest
      - key: LANDLORD_EMAIL
        value: info@neelacapital.com
      - key: ADMIN_EMAIL
        value: info@neelacapital.com
      - key: LANDLORD_NAME
        value: Neela Capital
      - key: CORS_ALLOWED_ORIGINS
        value: https://neelacapital.com,https://www.neelacapital.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_HOST_USER
        value: info@neelacapital.com
      - key: DEFAULT_FROM_EMAIL
        value: Neela Capital <info@neelacapital.com>
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Leave empty / unset — use Google Workspace SMTP instead
      - key: SENDGRID_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
